<!DOCTYPE html>
<html lang="es" data-bs-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HydraPure | The Future of Hydration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root { --brand-blue: #2563eb; --brand-dark: #0f172a; --brand-accent: #f59e0b; }
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .fade-in { animation: fadeIn 1s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .hero-section { background: var(--brand-dark); color: white; padding: 120px 0; position: relative; }
        .btn-premium { background-color: var(--brand-accent); border-radius: 50px; font-weight: 800; text-transform: uppercase; border: none; transition: 0.3s; padding: 15px 40px; }
        .btn-premium:hover { background-color: #fbbf24; transform: translateY(-3px); }
        .stat-card { border: 1px solid #e2e8f0; border-radius: 16px; padding: 25px; transition: 0.3s; background: white; }
        .stat-card:hover { border-color: var(--brand-blue); transform: translateY(-10px); }
        .price-tag { font-size: 2.5rem; font-weight: 800; color: var(--brand-blue); }
        .testimonio { font-size: 1.2rem; font-style: italic; color: #334155; }
        .hero-img { width: 100%; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        #scrollTop { position: fixed; bottom: 20px; right: 20px; display: none; z-index: 1000; border-radius: 50%; }
    </style>
</head>

<body data-bs-spy="scroll" data-bs-target="#navbar">

    <nav id="navbar" class="navbar navbar-expand-md bg-white border-bottom sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bolder" href="#"><i class="bi bi-droplet-fill text-primary"></i> HYDRAPURE</a>
            <div class="navbar-nav">
                <a class="nav-link" href="#precios">Precios</a>
                <a class="nav-link" href="#testimonios">Reseñas</a>
                <button class="btn btn-outline-dark rounded-pill ms-3">Acceso Privado</button>
            </div>
        </div>
    </nav>

    <main class="fade-in">
        <section class="hero-section text-center text-lg-start">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-lg-6">
                        <span class="badge bg-primary mb-3">LIDERANDO EL MERCADO DE HUMO</span>
                        <h1 class="display-1 fw-bolder text-white mb-4">La pureza no es barata.</h1>
                        <p class="lead text-secondary mb-5">Ingeniería aplicada al agua de tu grifo.</p>
                        <button class="btn btn-premium" onclick="abrirModalPromocion()">Solicitar Exclusividad</button>
                    </div>
                    <div class="col-lg-6 d-none d-lg-block">
                        <img src="https://www.portland.gov/sites/default/files/styles/twitter/public/2020/brown-water.jpg?itok=vpFyz_i1" class="hero-img" alt="HydraPure">
                    </div>
                </div>
            </div>
        </section>

        <section class="container my-5 p-5 bg-primary text-white rounded-5 text-center">
            <h3>¿Quieres más decepciones?</h3>
            <p>Suscríbete para recibir facturas sorpresa.</p>
            <input type="email" id="emailInput" class="form-control w-50 mx-auto" placeholder="tu.dinero@esnuestro.com">
            <button class="btn btn-warning mt-3" onclick="enviarNewsletter()">Enviar dinero</button>
        </section>

        </main>

    <div id="promoModal" class="modal fade" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-4">
                <h4>¡ESPERA! 🛑</h4>
                <p>¿Te vas ya? ¡Compra ahora y te regalamos una botella vacía gratis!</p>
                <button class="btn btn-warning" data-bs-dismiss="modal">Comprar ahora</button>
            </div>
        </div>
    </div>

    <button id="scrollTop" class="btn btn-primary" onclick="window.scrollTo(0,0)"><i class="bi bi-arrow-up"></i></button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function abrirModalPromocion() {
            new bootstrap.Modal(document.getElementById('promoModal')).show();
        }

        document.querySelector('.btn-outline-dark').addEventListener('click', function() {
            alert("Acceso denegado: Solo para clientes que han pagado la suscripción 'Ultra'.");
        });

        function enviarNewsletter() {
            const email = document.getElementById('emailInput').value;
            if(email !== "") {
                alert("¡Gracias, " + email + "! Pronto te llegará tu factura sorpresa.");
            } else {
                alert("Introduce un correo para que podamos cobrarte.");
            }
        }
    </script>
</body>
</html>
