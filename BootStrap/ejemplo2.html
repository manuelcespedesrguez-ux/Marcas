<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Mi segunda plantilla - 6 Libros</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>

        <div class="container mt-5">
            <h2>Mi segundo ejemplo</h2>
            
            <div class="row g-3">
                <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-4 col-xxl-4 bg-primary text-white p-3">Libro 1</div>
                <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-4 col-xxl-4 bg-secondary text-white p-3">Libro 2</div>
                <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-4 col-xxl-4 bg-success text-white p-3">Libro 3</div>
                <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-4 col-xxl-4 bg-warning text-dark p-3">Libro 4</div>
                <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-4 col-xxl-4 bg-info text-dark p-3">Libro 5</div>
                <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-4 col-xxl-4 bg-danger text-white p-3">Libro 6</div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
